name: Render Video

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/render-video.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pakai `npm ci` jika sudah ada package-lock.json, jika belum pakai `npm install`
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0

      - name: Render video
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: fakta-unik
          path: out/fakta-unik.mp4
          if-no-files-found: error
          retention-days: 14
